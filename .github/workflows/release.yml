name: Release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact reviewed current-main source commit
        required: true
      tag:
        description: Existing exact v2.0.0-next.N or v2.0.0 tag
        required: true
      intent:
        type: choice
        options: [major-prerelease, stable-major]
        required: true
      candidate_run_id:
        description: Successful CI run retaining the exact candidate tarballs; reuse on retry
        required: true

concurrency:
  group: npm-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_SHA: ${{ inputs.sha }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_INTENT: ${{ inputs.intent }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
      # No requested-checkout code/lifecycle runs before this trusted inline guard.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Authorize exact source using trusted workflow code
        id: authorize_source
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const {GITHUB_EVENT_NAME:event,GITHUB_REF:ref,RELEASE_SHA:sha,RELEASE_TAG:tag,RELEASE_INTENT:intent}=process.env;
          if(event!=='workflow_dispatch'||ref!=='refs/heads/main'||!/^[a-f0-9]{40}$/.test(sha??'')||!/^v2\.0\.0(?:-next\.\d+)?$/.test(tag??'')||!(intent==='major-prerelease'&&tag.includes('-next.')||intent==='stable-major'&&tag==='v2.0.0'))throw Error('Unauthorized release request');
          const lines=execFileSync('git',['ls-remote','--exit-code','origin','refs/heads/main','refs/tags/'+tag,'refs/tags/'+tag+'^{}'],{encoding:'utf8'}).trim().split('\n').map(l=>l.split(/\s+/));
          const refs=new Map(lines.map(([oid,name])=>[name,oid]));
          if(refs.get('refs/heads/main')!==sha||(refs.get('refs/tags/'+tag+'^{}')??refs.get('refs/tags/'+tag))!==sha)throw Error('Requested SHA/tag is not current remote main');
          console.log('authorized exact main/tag source');
          NODE
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.0.0'
          package-manager-cache: false
      - name: Pin direct-publish npm; install tooling without candidate lifecycle scripts
        run: |
          npm install --global npm@11.6.0 --ignore-scripts --registry=https://registry.npmjs.org
          node scripts/validation/run-isolated.mjs npm ci --ignore-scripts
      - name: Download the previously validated candidate without repacking
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/candidate-run.json','utf8'));
          if(r.head_sha!==process.env.RELEASE_SHA||r.path!=='.github/workflows/ci.yml'||r.event!=='push'||r.head_branch!=='main'||r.conclusion!=='success'||r.repository.full_name!==process.env.GITHUB_REPOSITORY)throw Error('Candidate requires successful same-repository main CI at exact SHA');
          NODE
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "candidate" and .expired == false)] | if length == 1 then .[0].id else error("Expected one retained candidate") end')
          [[ "$artifact_id" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/candidate.zip"
          python3 scripts/release/artifact-download.py "$RUNNER_TEMP/candidate.zip" artifacts/candidate
      - name: Verify retained bytes and explicit source binding
        run: node --import tsx scripts/release/preflight.ts artifacts/candidate
      - name: Publish or resume only these exact tarballs
        # Hosted per-package trusted publisher/direct-publish configuration remains a prerequisite.
        run: node --import tsx scripts/release/preflight.ts artifacts/candidate --publish | tee artifacts/candidate/publish-result.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: publish-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/candidate
          retention-days: 90
          if-no-files-found: error
